<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrusel de Imágenes</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="contenedor-carrusel">
    <!-- Título principal -->
    <h1 class="titulo-carrusel">Imagenes de nuestro proyecto</h1>

    <!-- Tres renglones de espacio / información -->
    <br>
    <br>
    <br>

    <!-- Matriz de 2 por 3 de imágenes -->
    <div class="galeria-grid">
      <!-- Fila 1 -->
      <a href="mis imagenes/images1.jpg" target="_blank" class="imagen-link">
        <div class="imagen-zoom">
          <img src="mis imagenes/images1.jpg" alt="Imagen 1">
        </div>
      </a>
      <a href="mis imagenes/images2.jpg" target="_blank" class="imagen-link">
        <div class="imagen-zoom">
          <img src="mis imagenes/images2.jpg" alt="Imagen 2">
        </div>
      </a>
      <a href="mis imagenes/images3.jpg" target="_blank" class="imagen-link">
        <div class="imagen-zoom">
          <img src="mis imagenes/images3.jpg" alt="Imagen 3">
        </div>
      </a>

      <!-- Fila 2 -->
      <a href="mis imagenes/images4.jpg" target="_blank" class="imagen-link">
        <div class="imagen-zoom">
          <img src="mis imagenes/images4.jpg" alt="Imagen 4">
        </div>
      </a>
      <a href="mis imagenes/images5.jpg" target="_blank" class="imagen-link">
        <div class="imagen-zoom">
          <img src="mis imagenes/images5.jpg" alt="Imagen 5">
        </div>
      </a>
      <a href="mis imagenes/images6.jpg" target="_blank" class="imagen-link">
        <div class="imagen-zoom">
          <img src="mis imagenes/images6.jpg" alt="Imagen 6">
        </div>
      </a>
    </div>

    <!-- Botón inferior para regresar a index.html -->
    <div class="contenedor-boton-inicio">
      <a href="index.html" class="btn-inicio-verde">
        <span class="icono-casa">🏠</span> inicio
      </a>
    </div>
  </div>

</body>
</html>
